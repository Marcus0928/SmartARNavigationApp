name: smart_ar_navigation
description: "Smart AR Navigation App for Enhanced Driving Assistance"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies: 
  flutter: 
    sdk: flutter

  cupertino_icons: ^1.0.8

  # AR
  ar_flutter_plugin_2: ^0.0.3 

  # Google Maps & Navigation
  google_maps_flutter: ^2.5.0
  flutter_polyline_points: ^2.0.0

  # GPS Location
  geolocator: ^12.0.0 

  # HTTP requests to Google APIs
  http: ^1.1.0

  # Map display (tile-based, no Google SDK required)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # State Management
  provider: ^6.1.0

  # Persistent settings storage
  shared_preferences: ^2.2.0

  # SQLite database for saved locations list
  sqflite: ^2.3.3
  path: ^1.9.0

  # API Key management
  flutter_dotenv: ^5.1.0

  # Keep screen on during AR navigation
  wakelock_plus: ^1.2.8

  # Foreground service to keep GPS/navigation alive when app is backgrounded
  flutter_foreground_task: ^8.0.0

dev_dependencies: 
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/map_style.json
    - assets/images/
    - assets/icons/